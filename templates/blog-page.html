{% extends "base.html" %}

{% block content %}

<link rel="stylesheet" href="/code.css" />
<head>
  <meta property="og:title" content="{{ page.title }}" />
  <title> {{page.title}} </title>
</head>


<h1 class="title">
  {{ page.title }}
</h1>
<p class="subtitle">
  <strong>{{ page.date }}</strong>
  <img style="max-width: 50px; max-height: 50px; align: right;" src="/wren_glasses.png" alt="A Wren."/>
  <br><br>
  <button onclick='flipdark()'> dark mode? </button>
  <button onclick="location.href = location.href.substring(0,location.href.lastIndexOf('/')) + '/..'">back?</button>
</p>
{{ page.content | safe }}


{% endblock content %}
